# Supabase configuration for Navernass
# https://supabase.com/docs/reference/config

# A unique identifier for the local project. Used to namespace local Docker containers
# (only relevant when running `supabase start`). For remote-only usage you can change
# this freely without affecting the linked production project.
project_id = "navernass"

[api]
# Local-only port (only used when running `supabase start`)
port = 54321
# REST exposes these schemas
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Pin the CLI version we tested against. Bumping this should be a deliberate PR.
[experimental]
# (intentionally empty; reserved for future flags)
