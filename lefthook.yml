# Pre-commit: 只检查暂存区（lint-staged 的范围由 .lintstagedrc.mjs 限定为 apps/frontend、apps/backend）
pre-commit:
  parallel: true
  commands:
    lint-staged:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm lint-staged

# Commit-msg: commit message 规范检查
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

# Pre-push: 推送前对前后端做完整门禁
pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format
    typecheck:
      run: pnpm typecheck:all
    test:
      run: pnpm test
