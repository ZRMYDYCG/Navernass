name: narraverse-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: narraverse
      MYSQL_USER: narraverse
      MYSQL_PASSWORD: narraverse
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_URL: mysql://narraverse:narraverse@mysql:3306/narraverse
      QDRANT_URL: http://qdrant:6333
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-auth-secret-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-local-development-ai-config-secret-32-chars}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["sh", "-c", "cd /app/apps/backend && node_modules/.bin/prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  qdrant_data:
