name: narraverse-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: narraverse
      MYSQL_USER: narraverse
      MYSQL_PASSWORD: narraverse
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_URL: mysql://narraverse:narraverse@mysql:3306/narraverse
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/backend && node_modules/.bin/prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
