packages:
  - 'apps/*'
  - 'packages/*'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - lefthook
  - prisma
  - sharp
ignoredBuiltDependencies:
  - '@scarf/scarf'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  '@scarf/scarf': false
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.58'
  - '@ai-sdk/gateway@4.0.87'
  - '@ai-sdk/google@4.0.76'
  - '@ai-sdk/openai-compatible@3.0.53'
  - '@ai-sdk/openai@4.0.71'
  - '@ai-sdk/provider-utils@5.0.45'
  - ai@7.0.107
